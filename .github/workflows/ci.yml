name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        r: [release]
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
  vendored-c:
    name: vendored C is the pinned tandem-c, on its main, and vectors are current
    runs-on: ubuntu-latest
    env:
      # The commit the README names; tools/sync_c.sh copies from it.
      TANDEM_C: eba98f2
    steps:
      - uses: actions/checkout@v7
      - run: git clone -q https://github.com/tandem-rng/tandem-c ../tandem-c
      - run: git -C ../tandem-c merge-base --is-ancestor "$TANDEM_C" origin/main
      - run: for f in tandem.c tandem.h tandem_normal_tables.h; do git -C ../tandem-c show "$TANDEM_C:$f" | diff - src/$f; done
      - run: git clone --depth 1 https://github.com/tandem-rng/spec ../spec
      - run: diff ../spec/vectors.json tests/testthat/vectors.json
